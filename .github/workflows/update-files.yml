name: Deploy to FTP

on:
  push:
    branches:
      - dev

jobs:
  update-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Update files
        run: |
          git update
      - name: SFTP upload
        uses: appleboy/sftp@v1
        with:
          host: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          remote-dir: /root/server_dev/server-mods/BeamMP_RP_Plugin
          local-dir: ./
          overwrite: true
