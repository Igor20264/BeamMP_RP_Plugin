name: Deploy to FTP

on:
  push:
    branches:
      - "*"

jobs:
  update-files:
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Clear Old Code and update database
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          script: |
            docker stop server_dev_beammp-server_1
            rm -rf /root/server_dev/server-mods/BeamMP_RP_Plugin
            mkdir /root/server_dev/server-mods/BeamMP_RP_Plugin
            cp -r /root/server/server-mods/economic/database /root/server_dev/server-mods/BeamMP_RP_Plugin
            chmod -R 777 /root/server_dev/server-mods/BeamMP_RP_Plugin

      - name: Pack Mod to zip
        run: |
          cd Client
          zip -r ../Client.zip .
          cd ..
          mkdir -p ./tempZip
          cp -r ./Client.zip ./tempZip
          cd ./tempZip
          ls

      - name: SFTP Plugin uploader
        uses: wangyucode/sftp-upload-action@v2.0.2
        with:
          host: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          localDir: ./Server/
          remoteDir: /root/server_dev/server-mods/BeamMP_RP_Plugin
          exclude: its_not_work/**,pattern/**,docs/**

      - name: Clear Old Code and update database
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          script: |
            cp -r /root/server/server-mods/economic/database /root/server_dev/server-mods/BeamMP_RP_Plugin

      - name: SFTP mod uploader
        uses: wangyucode/sftp-upload-action@v2.0.2
        with:
          host: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          localDir: ./tempZip
          remoteDir: /root/server_dev/client-mods/
          forceUpload: false
          exclude: .git/**,.github/**,.gitignore


      - name: Update Database
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          script: |
            docker start server_dev_beammp-server_1
