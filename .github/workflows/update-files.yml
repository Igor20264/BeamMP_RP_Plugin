name: Deploy to FTP

on:
  push:
    branches:
      - dev

jobs:
  update-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Clear Old Code
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          script: |
            rm -rf /root/server_dev/server-mods/BeamMP_RP_Plugin
            mkdir /root/server_dev/server-mods/BeamMP_RP_Plugin

      - name: SFTP upload
        uses: danhendrickson/sftp-transfer-action@v1.23
        with:
          server: ${{ secrets.FTP_HOST }}
          user: root
          pass: password
          port: 22
          remote-path: /root/server_dev/server-mods/BeamMP_RP_Plugin
          local-path: ./
          reverse: true
      - name: Update Database
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          script: |
            cp -r /root/server/server-mods/economic/database /root/server_dev/server-mods/BeamMP_RP_Plugin/database
