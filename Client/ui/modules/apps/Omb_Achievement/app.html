<!-- achievement.html -->
<div ng-controller="AchievementCtrl" class="achievement-container">
    <div class="achievement-card">
        <div class="achievement-icon">
            <img ng-src="{{achievementImage}}" alt="Achievement Icon">
        </div>
        <div class="achievement-content">
            <div class="achievement-title">Достижение разблокировано!</div>
            <div class="achievement-name">{{achievementTitle}}</div>
            <div class="achievement-desc">{{achievementDescription}}</div>
        </div>
    </div>
</div>
