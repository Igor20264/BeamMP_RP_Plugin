<canvas id="canvas" width="512" height="256"></canvas>

<script>
function goDraw(text, font, tintSprites, scaleX, scaleY, ctx, canvas , x, y, textSpace, textAlign, letSpacing) {

   var lineHeight = parseInt(font.common.lineHeight)
   var lineBase = parseInt(font.common.base);

	if(!letSpacing) var letSpacing = 0;
	var textSpaceChar = 0;

    var textWidth = 0
    for(var ci = 0; ci < text.length; ci++) {
      var c = text.charCodeAt(ci)
      if(font.charMap[c] === undefined) continue;
      var glyph = font.charMap[c];
      textWidth += glyph.xadvance * scaleX;
    }
	 
	if(letSpacing) {
		textWidth += letSpacing * (text.length - 1);
	 }
	if(textSpace) {
		if(textSpace >= textWidth && text.length > 1) {
			textTrueWidth = textWidth;
			textWidth = textSpace;
		}
		else {
			textTrueWidth = textWidth;
			textWidth = textTrueWidth;
		}
	 }
	 
	var tAlign = (textAlign == "left") ? 0 : (textAlign == "right") ? 1 : 0.5;
	 
    var x = canvas.width * x - textWidth * tAlign;
    var y = canvas.height * y - lineHeight * 0.5;
    //console.log('starting pos:',x, y, textWidth, canvas.width, lineHeight, canvas.height)
    for(var ci = 0; ci < text.length; ci++) {
      var c = text.charCodeAt(ci)

      if(font.charMap[c] === undefined) {
        console.log("character not found: ", c)
        continue;
      }
      var glyph = font.charMap[c];
      //console.log(c, glyph)

	  var w = glyph.width;
      var h = glyph.height;
      ctx.drawImage(tintSprites,
        glyph.x + (glyph.xadvance - glyph.width) / 2, glyph.y, w, h,
        x + ((glyph.xadvance - glyph.width) / 2 + glyph.xoffset) * scaleX, y - (lineHeight - lineBase) - glyph.yoffset * scaleY, w * scaleX, h * scaleY);

		if(text.includes('_') && textSpace && c == 95 && textTrueWidth <= textSpace) {
			glyph.xadvance = (textWidth - textTrueWidth) / text.match(/\_/g).length;
		}
		else if(!text.includes('_') && textSpace && textTrueWidth <= textSpace) {
			textSpaceChar = (textWidth - textTrueWidth) / (text.length - 1);
		}
		
      x += glyph.xadvance * scaleX + letSpacing + textSpaceChar;
		
    }
}


var checkValid = function(text, type) {
	var regex = [
		["regular_car3x", /^[abekmhopctyx]{1}[0-9]{3}[abekmhopctyx]{2}[0-9]{3}/gmi],
		["regular_car", /^[abekmhopctyx]{1}[0-9]{3}[abekmhopctyx]{2}[0-9]{2}/gmi, "x000xx77"],
		["regular_trailer", /^[abekmhopctyx]{2}[0-9]{6}/gmi],
		["regular_tractor", /^[0-9]{4}[abekmhopctyx]{2}[0-9]{2}/gmi],
		["police_car", /^[abekmhopctyx]{1}[0-9]{6}/gmi, "x000077"],
		["police_trailer", /^[0-9]{3}[abekmhopctyx]{1}[0-9]{2}/gmi],
		["mil_car", /^[0-9]{4}[abekmhopctyx]{2}[0-9]{2}/gmi, "0000xx77"],
		["mil_trailer", /^[abekmhopctyx]{2}[0-9]{6}/gmi],
		["dip_cons", /^[0-9]{3}[dt]{1}[0-9]{5}/gmi, "000CD077"],
		["dip_amb", /^[0-9]{3}cd[0-9]{3}/gmi],
		["dip_nonres", /^[abekmhopctyx]{2}[0-9]{3}[abekmhopctyx]{1}[0-9]{2}/gmi],
		["dip_nonres_biz", /^[0-9]{3}[bekmh]{1}[0-9]{5}/gmi],
		["taxi", /^[abekmhopctyx]{2}[0-9]{5}/gmi, "xx00077"],
		["transit", /^[abekmhopctyx]{2}[0-9]{3}[abekmhopctyx]{1}[0-9]{2}/gmi, "xx000x77"],
		["retro", /^[kct]{1}[abekmhopctyx]{2}[0-9]{5}/gmi],
		["federal", /^[abekmhopctyx]{1}[0-9]{3}[abekmhopctyx]{2}/gmi]
	];
	
	if(text == "#FORMAT") {
		for(var i = 0; i < regex.length; i++) {
			if(regex[i][0].includes(type) && typeof regex[i][2] !== 'undefined') return regex[i][2];
		}
	}
	else if(text !== "#FORMAT") {
		for(var i = 0; i < regex.length; i++) {
			if(regex[i][0].includes(type) && regex[i][1].test(text)) return regex[i][0];
		}
	}
	if(text == "#FORMAT") return "404";
	else return null;
}


String.prototype.ss = function(fc, lc, cbeetw) {
	if(!lc) var lc = fc + 1;
	var text = this.substring(fc, lc);
	textLen = text.length;
	if(typeof cbeetw !== 'undefined') {
		var textC = "";
		for(var i = 0; i < textLen; i++) { 
			textC += text.charAt(i);
			if(i < text.length - 1) textC += cbeetw;
		}
		text = textC;
	}
	return text;
}

String.prototype.ls = function(l, cbeetw) {
	var chars = "";
	for(var i = 0; i < l.length; i++) {
		 chars += this.charAt(l[i]);
		 if(cbeetw && i < l.length - 1) chars += cbeetw;
	}
	return chars;
}


function init(mode, text, design) {

   if(design == null) {
      design = {
        "name" : "Default",
        "version" : 1,
        "data" : {
            "size" : {"x" : 512, "y": 256},
            "text" : { "x" : 0.5, "y" : 0.5, "scale" : 1, "color" : "black", "limit" : 8},
            "diffuse" : {
                "spriteImg" : "vehicles/common/licenseplates/default/platefont_d.png",
                //"backgroundImg" : "vehicles/common/licenseplates/default/licenseplate-default_d.png",
                "fillStyle" : "white"
            },

            "bump" : {
                "spriteImg" : "vehicles/common/licenseplates/default/platefont_n.png",
                "backgroundImg" : "vehicles/common/licenseplates/default/licenseplate-default_n.png",
                "fillStyle" : "rgb(0,0,255)"
            },

                "spriteImg" : "vehicles/common/licenseplates/default/platefont_s.png",
                "fillStyle" : "rgb(233,233,233)"
            }
         }
      };
   }
  var ddt = design.data.text;
  var plateEU = (design.data.format === "30-15") ? false : (design.data.format === "52-11") ? true : null;
  var displayType = null;
  var plateType = null;
  var t = [];
  
  if(ddt.extraStyles) var extraStyles = ddt.extraStyles;
  
  text = text.toLowerCase();

	if(plateEU) {
		var scale = (ddt.scale) ? ddt.scale : 0.85;
		var scaleX = (ddt.scaleX) ? ddt.scaleX : scale;
		var scaleY = (ddt.scaleY) ? ddt.scaleY : scale;
		var scaleReg = (ddt.scaleReg) ? ddt.scaleReg : 0.665;
		var x = (ddt.x) ? ddt.x : 0.52;
		var y = (ddt.y) ? ddt.y : 0.571;
		var xReg = (ddt.xRegion) ? ddt.xReg : 0.867;
		var yReg = (ddt.yRegion) ? ddt.yReg : 0.525;
         
    }
    else if(!plateEU) {
		var scale = (ddt.scale) ? ddt.scale : 0.87;
		var scaleX = (ddt.scaleX) ? ddt.scaleX : scale;
		var scaleY = (ddt.scaleY) ? ddt.scaleY : scale;
		var scaleReg = (ddt.scaleReg) ? ddt.scaleReg : 0.70;
		var x = (ddt.x) ? ddt.x : 0.50;
		var y = (ddt.y) ? ddt.y : 0.282;
		var x2 = (ddt.x2) ? ddt.x2 : 0.31;
		var y2 = (ddt.y2) ? ddt.y2 : 0.763;
		var xReg = (ddt.xRegion) ? ddt.xReg : 0.785;
		var yReg = (ddt.yRegion) ? ddt.yReg : 0.754;
    }
	
		style = Number(text.charAt(text.indexOf('!') + 1));
		if(text.includes('!') && /[1-9]/g.test(style)) var stl = style; else { stl = 1; style = 1; }
		//style = Number(text.charAt(text.indexOf('!') - 1));
		//if(text.includes('!') && /[1-9]/g.test(style)) var stl2 = style; else { stl2 = 1; style = 1; }
		
		srcImg = design.data[mode].backgroundImg;
	if(text && checkValid(text, ddt.type)) {
		var plateType = checkValid(text, ddt.type);
	
		if(mode !== "specular" && plateType !== null && extraStyles !== undefined) {
			if(extraStyles[plateType] !== undefined && extraStyles[plateType].src !== undefined) {
				srcImg = srcImg.ss(0, srcImg.indexOf('1') - 1) + extraStyles[plateType].src + srcImg.ss(srcImg.indexOf('1'), srcImg.length);
			}

			if(stl !== 1) {
				var srcImgStl = srcImg;
				if(extraStyles.defaultStyles !== undefined && stl <= extraStyles.defaultStyles) {
					srcImgStl = srcImg.ss(0, srcImg.indexOf('1')) + String(stl) + srcImg.ss(srcImg.indexOf('1') + 1, srcImg.length);
				}
				else if(extraStyles[plateType] !== undefined && extraStyles[plateType].styles !== undefined && stl <= extraStyles[plateType].styles) {
					srcImgStl = srcImg.ss(0, srcImg.indexOf('1')) + String(stl) + srcImg.ss(srcImg.indexOf('1') + 1, srcImg.length); 
				}
				else stl = 1;
				srcImg = srcImgStl;
			}

			if(extraStyles.differentStyles == true && stl2 !== 1 && design.data.format === "30-15") {
				srcImg = design.data[mode].backgroundImg;
				var srcImgStl = srcImg;
				if(extraStyles.defaultStyles !== undefined && stl2 <= extraStyles.defaultStyles) {
					srcImgStl = srcImg.ss(0, srcImg.indexOf('1')) + String(stl2) + srcImg.ss(srcImg.indexOf('1') + 1, srcImg.length); 
				}
				else if(extraStyles[plateType] !== undefined && extraStyles[plateType].styles !== undefined && stl2 <= extraStyles[plateType].styles) {
					srcImgStl = srcImg.ss(0, srcImg.indexOf('1')) + String(stl2) + srcImg.ss(srcImg.indexOf('1') + 1, srcImg.length);
				}
				else stl2 = 1;
				srcImg = srcImgStl;
			}
			else if(extraStyles.differentStyles == true && design.data.format === "30-15") {
				srcImg = design.data[mode].backgroundImg;
				stl2 = 1;
			}
		}
		
	
		switch(plateType) {

					t[1] = text.ss(4, 6);
					tReg = text.ss(6, 8);
				}

					tReg = text.ss(6, 8);
					
				}

				break;
			case("regular_car3x"):

					t[0] = text.ss(0, 1) + ' ' + text.ss(1, 4);
					t[1] = text.ss(4, 6);
					tReg = text.ss(6, 9);
				}
				else if(design.data.format === "52-11") {
					t[0] = text.ss(0, 6);
					tReg = text.ss(6, 9);
				}
				displayType = "DEFAULT_SINGLE";
				break;
				
			case("regular_trailer"):
				if(design.data.format === "30-15") {
					text = text.toUpperCase();
					t[0] = text.ss(0, 2) + ' ' + text.ss(2, 4);
					t[1] = text.ss(4, 6);
					tReg = text.ss(6, 8);
				}
				else if(design.data.format === "52-11") {
					t[0] = text.ss(0, 2) + ' ' + text.ss(2, 6);
					tReg = text.ss(6, 8);
				}
				displayType = "DEFAULT_SINGLE";
				break;
				
			case("regular_tractor"):
			if(design.data.format === "30-15") {
					t[0] = text.ss(0, 4);
					t[1] = text.ss(4, 6);
					t[1] = t[1].toUpperCase();
					tReg = text.ss(6, 8);
				}
				else if(design.data.format === "52-11") {
					t[0] = text.ss(0, 4) + ' ' + text.ss(4, 6);
					tReg = text.ss(6, 8);
				}
				displayType = "DEFAULT_SINGLE";
				break;
				
			case("police_car"):
			if(design.data.format === "52-11") {
				t[0] = text.ss(0, 1) + '  ' + text.ss(1, 5);
				tReg = text.ss(5, 7);
				}
				displayType = "DEFAULT_SINGLE";
				break;
				
			case("police_trailer"):
			if(design.data.format === "52-11") {
				t[0] = text.ss(0, 3) + '  ' + text.ss(3, 4);
				tReg = text.ss(4, 6);
				}
				displayType = "DEFAULT_SINGLE";
				break;
				
			case("mil_car"):
			if(design.data.format === "52-11") {
				t[0] = text.ss(0, 4) + ' ' + text.ss(4, 6);
				tReg = text.ss(6, 8);
				}
				displayType = "DEFAULT_SINGLE";
				break;
				
			case("mil_trailer"):
			if(design.data.format === "52-11") {
				t[0] = text.ss(0, 2) + ' ' + text.ss(2, 6);
				tReg = text.ss(6, 8);
				}
				displayType = "DEFAULT_SINGLE";
				break;
				
			case("dip_cons"):
			if(design.data.format === "52-11") {
				t[0] = text.ss(0, 4);
				t[1] = text.ss(4, 7);
				tReg = text.ss(7, 9);
				}
			else if(design.data.format === "30-15") {

				}

				break;
				
			case("dip_amb"):

				t[1] = text.ss(5, 6);

				}
			else if(design.data.format === "30-15") {

				t[1] = text.ss(3, 5) + ' ' + text.ss(5);

				}

			case("dip_nonres"):

				}

				break;
				
			case("transit"):

				tReg = text.ss(6, 8);
				}
				displayType = "DEFAULT_SINGLE";
				break;
				
			case("retro"):
			if(design.data.format === "52-11") {
				tType = text.ss(0, 1).toUpperCase();
				t[0] = text.ss(1, 6);

				}
			else if(design.data.format === "30-15") {
				text = text.toUpperCase();
				tType = text.ss(0, 1);
				
				t[0] = text.ss(1, 3);
				t[1] = text.ss(3, 6);
				tReg = text.ss(6, 8);
			}
				displayType = "RETRO";
				break;
				
			case("federal"):
			if(design.data.format === "52-11") {
				t[0] = text.ss(0, 1) + '_' + text.ss(1, 4) + '_' + text.ss(4, 6);
				tReg = text.ss(6, 8);
				}
				displayType = "DEFAULT_SINGLE";
				break;
		}
  }
  
  if(typeof tReg !== 'undefined') {
	if(tReg.length == 2) {
		var regionOffset = 0;
		var textOffset = 0;
		var regionBetween = false;
	  }
	  else if(tReg.length == 3) {
		var regionOffset = -0.034;
		var textOffset = -0.034;
		var regionBetween = -4;
	  }
	  else {
		var regionOffset = 0;
		var textOffset = 0;

	  }

  var font = design.data.characterLayout;
  
  font.charMap = {};
  for(var i = 0; i < font.chars.count; i++) {
      for(var d in font.chars.char[i]) {

      }
      font.charMap[parseInt(font.chars.char[i].id)] = font.chars.char[i];
  }
  var canvas = document.getElementById('canvas');
  canvas.width = design.data.size.x;
  canvas.height = design.data.size.y;
  var ctx = canvas.getContext('2d');

  if(design.data[mode] == null) {
    console.log(mode + " is not a valid mode");
    return;
  }

  //console.log(design.data[mode]);

  ctx.fillStyle = design.data[mode].fillStyle;

  ctx.rect(0, 0, canvas.width, canvas.height);
  ctx.fill();

  var background = null;
  var sprites = null;

  var checkRender = function() {
    if( (background && !background.isLoaded) || !sprites.isLoaded) return;

    if( background ) {
      ctx.drawImage(background, 0, 0, background.naturalWidth, background.naturalHeight, 0, 0, canvas.width, canvas.height);
    }

    var tintSprites = sprites;
    if( mode == "diffuse") {
      tintSprites = document.createElement('canvas');
      tintSprites.width = sprites.width;
      tintSprites.height = sprites.height;
      var tintCtx = tintSprites.getContext('2d');
	  if(displayType == null && ddt.type !== undefined || ddt.type !== undefined && typeof t[0] == 'undefined') tintCtx.fillStyle = "black";
      else if(extraStyles !== undefined && extraStyles[plateType] !== undefined && extraStyles[plateType].color !== undefined) tintCtx.fillStyle = extraStyles[plateType].color;
      else tintCtx.fillStyle = ddt.color;
      tintCtx.fillRect(0, 0, tintSprites.width, tintSprites.height);

      tintCtx.globalCompositeOperation = "multiply";
      tintCtx.drawImage(sprites, 0, 0);

      tintCtx.globalCompositeOperation = "destination-in";
      tintCtx.drawImage(sprites, 0, 0);
    }
	
	if(displayType == null && ddt.type !== undefined || ddt.type !== undefined && typeof t[0] == 'undefined') {
		
		if(text.toUpperCase() !== "#BLANK" && checkValid("#FORMAT", ddt.type) !== "404") {

		else goDraw('404', font, tintSprites, scale, scale, ctx, canvas , x, y);

	else if(displayType == "DEFAULT_SINGLE") {

			else txtSpc = null;

		 }

	else if(displayType == "DIP_CONS") {
		if(plateEU) {
			goDraw(t[0], font, tintSprites, scaleX, scaleY, ctx, canvas , x, y);
			goDraw(t[1], font, tintSprites, scaleReg, scaleReg, ctx, canvas , ddt.x2, ddt.y2);
			goDraw(tReg, font, tintSprites, scaleReg, scaleReg, ctx, canvas , xReg, yReg);
		}
		else if(!plateEU) {
			goDraw(t[0], font, tintSprites, scaleX, scaleY, ctx, canvas , x, y);
			goDraw(t[1], font, tintSprites, scaleReg, scaleReg, ctx, canvas , x2, 0.83);
			goDraw(tReg, font, tintSprites, scaleReg, scaleReg, ctx, canvas , xReg, yReg);
		}
	}	
	else if(displayType == "DIP_AMB") {
		if(plateEU) {
			goDraw(t[0], font, tintSprites, scaleX, scaleY, ctx, canvas , ddt.xamb, y);
			goDraw(t[1], font, tintSprites, scaleX, scaleY, ctx, canvas , ddt.xamb2, y);
			goDraw(tReg, font, tintSprites, scaleReg, scaleReg, ctx, canvas , xReg, yReg);
		}
		else if(!plateEU) {
			goDraw(t[0], font, tintSprites, scaleX, scaleY, ctx, canvas , x, y);
			goDraw(t[1], font, tintSprites, scaleX, scaleY, ctx, canvas , x2, y2);
			goDraw(tReg, font, tintSprites, scaleReg, scaleReg, ctx, canvas , xReg, yReg);
		}
	}
	else if(displayType == "RETRO") {
	   if(plateEU) {
			goDraw(t[0], font, tintSprites, scaleX, scaleY, ctx, canvas , x, y);
			goDraw(tReg, font, tintSprites, scaleReg, scaleReg, ctx, canvas , xReg, yReg);
			goDraw(tType, font, tintSprites, scaleX, scaleY, ctx, canvas , 0.10, y);
	   }
		else if(!plateEU) {
			goDraw(t[0], font, tintSprites, scaleX, scaleY, ctx, canvas , x, y);
			goDraw(t[1], font, tintSprites, scaleX, scaleY, ctx, canvas , x2, y2);
			goDraw(tReg, font, tintSprites, scaleReg, scaleReg, ctx, canvas , xReg, yReg);
			goDraw(tType, font, tintSprites, scaleX, scaleY, ctx, canvas , 0.21, y);
		}
	}
	
    if(typeof beamng !== 'undefined') {
      beamng.uiUpdate();
      beamng.uiDestroy();
    }
  }

	function drawSticker(src, x, y, width, height) {
	  const ctx = document.getElementById("canvas").getContext("2d");
	  const img = new Image();
	  img.onload = () => {
		 if(width && height) ctx.drawImage(img, x, y, width, height);
		 else ctx.drawImage(img, x, y);
	  };
	  src = "local://local/vehicles/common/licenseplates/" + src.ss(0, src.indexOf("_d.") + 1) + modeLetter() + ".png";
	  img.src = src;
	  
	  function modeLetter() {
			if(mode == "bump") return "n";
			else if(mode == "specular") return "s";
			else return "d";
	  }
	}
	
	var calcWidth = function(txt, scl) {
		var width = 0;
		for(var ci = 0; ci < txt.length; ci++) {
		var c = txt.charCodeAt(ci);
		var glyph = font.charMap[c];
		width += glyph.xadvance * scl;
		}
		return width;
	}

  if(srcImg !== undefined) {
    background = new Image();
    background.src = "local://local/" + srcImg;
    background.addEventListener("load", function() { background.isLoaded = true; checkRender(); });
  }
 else if(design.data[mode].backgroundImg !== undefined) {
    background = new Image();
    background.src = "local://local/" + design.data[mode].backgroundImg;
    background.addEventListener("load", function() { background.isLoaded = true; checkRender(); });
  }
  
  var srcSpr = "local://local/" + design.data[mode].spriteImg;

  if(extraStyles !== undefined && extraStyles.setStyles !== undefined) {
	for(var a = 0; a < extraStyles.setStyles.length; a++) {
		for(var ib = 0; ib < extraStyles.setStyles[a].types.length; ib++) {
			if(extraStyles.setStyles[a].types[ib] == plateType) {
				for(var is = 0; is <= extraStyles.setStyles[a].styleNum.length; is++) {
					if(extraStyles.setStyles[a].styleNum[is] == style) {
						if(extraStyles.setStyles[a].font !== undefined) {
							srcSpr = srcSpr.ss(0, srcSpr.indexOf(".png")) + "_" + extraStyles.setStyles[a].font + ".png";
						}
					}
				}
			}
		}	
	}
	
	
  }

  sprites = new Image();
  sprites.src = srcSpr;
  sprites.addEventListener("load", function() { sprites.isLoaded = true; checkRender(); }, false);
  
}
/// for debugging inside the browser:
if(typeof beamng === 'undefined') {
  var testText = 'TEST 123';
  //init('diffuse', testText);
  //init('bump', testText);
  init('specular', testText);
}
